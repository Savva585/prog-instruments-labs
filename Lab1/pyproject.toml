[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "cipher-analysis"
version = "1.0.0"
description = "Frequency analysis and decryption tool"
requires-python = ">=3.8"
[tool.ruff]
target-version = "py38"
line-length = 100
exclude = [".git", "__pycache__", "venv"]
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (ошибки стиля)
    "W",   # pycodestyle warnings (предупреждения стиля)
    "F",   # pyflakes (неиспользуемые переменные, импорты)
    "I",   # isort (сортировка импортов)
    "N",   # pep8-naming (правила именования)
    "UP",  # pyupgrade (использование новых возможностей Python)
    "B",   # flake8-bugbear (потенциальные баги)
]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[tool.pyright]
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
